<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>8 e 9</title>


</head>

<style>
    body {
        background: #fff;
        color: #111;
        transition: 1s
    }

    body.escuro {
        background: #000;
        color: #ff0
    }

    body.escuro input {
        background: #000;
        color: #ff0;
        border: 2px solid #ff0
    }

    body.escuro button {
        background: #ff0;
        color: #000
    }

</style>

<body>

    <button id="modo">Modo escuro</button>
    <h2>Qual seu sabor de sorvete favorito?</h2>
    <input id="sabor" placeholder="Digite um sabor">
    <p id="frase"></p>


    <script>
        const input = document.getElementById("sabor");
        const frase = document.getElementById("frase");
        input.addEventListener("input", () => {
            const texto = input.value.trim().toLowerCase();
            if (texto.length <= 3) { frase.textContent = ""; return; }
            if (texto === "chocolate") frase.textContent = "Eu amo sorvete de chocolate!";
            else if (texto === "flocos") frase.textContent = "Ahh, mas chocolate é o meu favorito...";
            else frase.textContent = "Ahh, eu esperava um sabor de sorvete...";
        });
        const btn = document.getElementById("modo");
        btn.addEventListener("click", () => {
            const escuro = document.body.classList.toggle("escuro");
            btn.textContent = escuro ? "Modo claro" : "Modo escuro";
        });

    </script>
</body>

</html>
