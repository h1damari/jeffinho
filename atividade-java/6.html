<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6</title>
</head>

<body>

    <h2 id="nome">Clique para gerar uma aventura</h2>
    <button id="gerar">Gerar aventura</button>


    <script>
        const acoes = ["A Busca", "A Batalha", "O Resgate"];
        const locais = ["na Floresta Sombria", "no Reino Perdido", "na Montanha Misteriosa"];
        const complementos = ["do Dragão", "do Tesouro Esquecido", "da Espada Ancestral"];
        const sortear = lista => lista[Math.floor(Math.random() * lista.length)];
        document.getElementById("gerar").addEventListener("click", () => {
            document.getElementById("nome").textContent =
                `${sortear(acoes)} ${sortear(locais)} ${sortear(complementos)}`;
        });

    </script>

</body>

</html>
