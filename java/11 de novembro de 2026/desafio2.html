<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Layout Responsivo Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        header, footer{
            background-color: black;
            color: white;
        }
    </style>

</head>

<body class="d-flex flex-column min-vh-100">

    <header>

        <div class="container text-center p-4">
            <div class="row">
                <div class="col">Inicio</div>
                <div class="col">Sobre nós</div>
                <div class="col">História</div>
                <div class="col">Contato</div>
            </div>
        </div>

    </header>

    <main class="flex-grow-1">
        <div class="container">
            <h1>Conteúdo</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Non earum natus ducimus veniam id harum alias maxime tempora exercitationem est iste officia, eaque maiores expedita molestiae error. Officia, facere iste!</p>
        </div>
    </main>

    <footer class="text-center p-4">
        <marquee behavior="" direction="">Feito por Jefferson Chaves</marquee>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
