<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3</title>
</head>

<body>

    <h1 id="titulo">Título original</h1>

    <script>
        const h1 = document.getElementById("titulo");
        const cores = ["crimson", "royalblue", "seagreen", "darkorange", "purple"];
        h1.style.color = cores[Math.floor(Math.random() * cores.length)];
        h1.style.fontSize = (Math.floor(Math.random() * 71) + 30) + "px"; // 30 a 100
        h1.textContent = "Texto alterado pelo JavaScript!";
    </script>
</body>

</html>
