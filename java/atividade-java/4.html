<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4</title>
</head>

<body>

        <p id="contador">0</p>
        <button id="incrementar">Incrementar</button>
        <button id="zerar">Zerar</button>

        <script>
            let valor = 0;
            const p = document.getElementById("contador");
            document.getElementById("incrementar").addEventListener("click", () => {valor++; p.textContent = valor;});
            document.getElementById("zerar").addEventListener("click", () => {valor = 0; p.textContent = valor;});
        </script>
    </body>

</html>
